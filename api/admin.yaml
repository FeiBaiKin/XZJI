openapi: 3.0.3
info:
  title: XZJI 后台接口
  version: 1.0.0
  description: |
    后台管理使用的接口，随后端一起发布，不做版本兼容。
    使用独立的 HttpOnly Cookie（xzji_admin_session，只作用于后台域名），与前台会话互相隔离。
    写请求需要带 X-CSRF-Token 请求头，令牌通过 GET /auth/csrf 获取。
servers:
  - url: /admin-api/v1
tags:
  - name: auth
    description: 后台登录
  - name: system
    description: 系统
  - name: users
    description: 用户管理
  - name: content
    description: 分类、标签与内容
  - name: media
    description: 图片上传
  - name: settings
    description: 站点设置
  - name: comments
    description: 评论审核
  - name: membership
    description: 会员等级与套餐
  - name: orders
    description: 订单与余额
paths:
  /auth/csrf:
    get:
      operationId: getCsrfToken
      summary: 获取 CSRF 令牌
      tags: [auth]
      responses:
        "200":
          description: CSRF 令牌
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"

  /auth/session:
    get:
      operationId: getSession
      summary: 当前登录状态
      description: 未登录时不返回 admin 字段，也不返回 401。
      tags: [auth]
      responses:
        "200":
          description: 登录状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionState"

  /auth/login:
    post:
      operationId: login
      summary: 管理员登录
      description: 只有角色为 admin 的账号可以登录，会话 12 小时后过期。
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/logout:
    post:
      operationId: logout
      summary: 退出登录
      tags: [auth]
      responses:
        "204":
          description: 已退出

  /me:
    get:
      operationId: getMe
      summary: 当前管理员
      tags: [auth]
      security:
        - adminCookieAuth: []
      responses:
        "200":
          description: 管理员信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/password:
    post:
      operationId: changePassword
      summary: 修改自己的密码
      tags: [auth]
      security:
        - adminCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: 已修改
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /system/status:
    get:
      operationId: getSystemStatus
      summary: 系统状态
      tags: [system]
      security:
        - adminCookieAuth: []
      responses:
        "200":
          description: 系统状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users:
    get:
      operationId: listUsers
      summary: 用户列表
      tags: [users]
      security:
        - adminCookieAuth: []
      parameters:
        - name: keyword
          in: query
          description: 按邮箱或昵称模糊搜索
          schema:
            type: string
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/Role"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/UserStatus"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 用户分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/{id}:
    patch:
      operationId: updateUser
      summary: 修改用户角色或状态
      description: 封禁后该用户的所有会话立即失效。不能修改自己的角色和状态。操作会写入后台日志。
      tags: [users]
      security:
        - adminCookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: 修改后的用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /media:
    post:
      operationId: uploadMedia
      summary: 上传图片
      description: 只接受 JPEG、PNG、GIF、WebP，按文件内容判断类型；大小上限为配置项 media.max_size_mb。
      tags: [media]
      security:
        - adminCookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /categories:
    get:
      operationId: listCategories
      summary: 分类列表
      description: 按排序值返回全部分类（平铺，由 parentId 组成树）。postCount 为该分类自身未删除的内容数。
      tags: [content]
      security:
        - adminCookieAuth: []
      responses:
        "200":
          description: 分类列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategoryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCategory
      summary: 新建分类
      tags: [content]
      security:
        - adminCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: 新建的分类
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /categories/{id}:
    put:
      operationId: updateCategory
      summary: 修改分类
      tags: [content]
      security:
        - adminCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: 修改后的分类
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteCategory
      summary: 删除分类
      description: 分类下还有子分类或内容（包括回收站）时不能删除。
      tags: [content]
      security:
        - adminCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /tags:
    get:
      operationId: listTags
      summary: 标签列表
      tags: [content]
      security:
        - adminCookieAuth: []
      parameters:
        - name: keyword
          in: query
          description: 按名称或 slug 模糊搜索
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 标签分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTagPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTag
      summary: 新建标签
      tags: [content]
      security:
        - adminCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagInput"
      responses:
        "201":
          description: 新建的标签
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /tags/{id}:
    put:
      operationId: updateTag
      summary: 修改标签
      tags: [content]
      security:
        - adminCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagInput"
      responses:
        "200":
          description: 修改后的标签
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteTag
      summary: 删除标签
      description: 同时解除与内容的关联，内容本身不受影响。
      tags: [content]
      security:
        - adminCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts:
    get:
      operationId: listPosts
      summary: 内容列表
      description: 不传 status 时返回回收站以外的全部内容。
      tags: [content]
      security:
        - adminCookieAuth: []
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/PostType"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PostStatus"
        - name: categoryId
          in: query
          description: 包含子分类
          schema:
            type: integer
            format: int64
        - name: keyword
          in: query
          description: 按标题模糊搜索
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 内容分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPostPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createPost
      summary: 新建内容
      tags: [content]
      security:
        - adminCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: 新建的内容
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPost"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /posts/{id}:
    get:
      operationId: getPost
      summary: 内容详情
      tags: [content]
      security:
        - adminCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: 内容
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPost"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updatePost
      summary: 修改内容
      description: 整体替换。回收站里的内容需要先恢复才能修改。
      tags: [content]
      security:
        - adminCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "200":
          description: 修改后的内容
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPost"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deletePost
      summary: 删除内容
      description: 默认移入回收站；permanent=true 时彻底删除，只能删除回收站里的内容，操作会写入后台日志。
      tags: [content]
      security:
        - adminCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: permanent
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "204":
          description: 已删除
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/restore:
    post:
      operationId: restorePost
      summary: 从回收站恢复
      description: 恢复为草稿。
      tags: [content]
      security:
        - adminCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: 已恢复
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /platforms:
    get:
      operationId: listPlatforms
      summary: 已使用的资源平台
      description: 用于编辑资源时提示可选值。
      tags: [content]
      security:
        - adminCookieAuth: []
      responses:
        "200":
          description: 平台名称
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformNames"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /settings/home:
    get:
      operationId: getHomeSettings
      summary: 首页设置
      tags: [settings]
      security:
        - adminCookieAuth: []
      responses:
        "200":
          description: 首页设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateHomeSettings
      summary: 修改首页设置
      tags: [settings]
      security:
        - adminCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomeSettingsInput"
      responses:
        "200":
          description: 修改后的首页设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /settings/site:
    get:
      operationId: getSiteSettings
      summary: 站点设置
      tags: [settings]
      security:
        - adminCookieAuth: []
      responses:
        "200":
          description: 站点设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateSiteSettings
      summary: 修改站点设置
      tags: [settings]
      security:
        - adminCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettingsInput"
      responses:
        "200":
          description: 修改后的站点设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /membership/levels:
    get:
      operationId: listMembershipLevels
      summary: 会员等级列表
      tags: [membership]
      security:
        - adminCookieAuth: []
      responses:
        "200":
          description: 会员等级，按 rank 从低到高
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLevelList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createMembershipLevel
      summary: 新建会员等级
      tags: [membership]
      security:
        - adminCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LevelInput"
      responses:
        "201":
          description: 新建的等级
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLevel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /membership/levels/{id}:
    put:
      operationId: updateMembershipLevel
      summary: 修改会员等级
      tags: [membership]
      security:
        - adminCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LevelInput"
      responses:
        "200":
          description: 修改后的等级
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLevel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteMembershipLevel
      summary: 删除会员等级
      description: 还有用户是这个等级的会员时不能删除，可以改为停用。
      tags: [membership]
      security:
        - adminCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /users/{id}/membership:
    put:
      operationId: setUserMembership
      summary: 开通或修改用户的会员
      description: 后台手动开通，不产生订单。操作会写入后台日志。
      tags: [users]
      security:
        - adminCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMembershipRequest"
      responses:
        "200":
          description: 修改后的用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteUserMembership
      summary: 取消用户的会员
      tags: [users]
      security:
        - adminCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: 已取消
        "401":
          $ref: "#/components/responses/Unauthorized"

  /comments:
    get:
      operationId: listComments
      summary: 评论列表
      tags: [comments]
      security:
        - adminCookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/CommentStatus"
        - name: postId
          in: query
          schema:
            type: integer
            format: int64
        - name: keyword
          in: query
          description: 按评论内容模糊搜索
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 评论分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCommentPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /comments/{id}:
    patch:
      operationId: updateComment
      summary: 审核评论
      tags: [comments]
      security:
        - adminCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommentRequest"
      responses:
        "200":
          description: 修改后的评论
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminComment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteComment
      summary: 删除评论
      description: 删除一级评论时连同它下面的回复一起删除。
      tags: [comments]
      security:
        - adminCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /settings/comment:
    get:
      operationId: getCommentSettings
      summary: 评论设置
      tags: [settings]
      security:
        - adminCookieAuth: []
      responses:
        "200":
          description: 评论设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateCommentSettings
      summary: 修改评论设置
      tags: [settings]
      security:
        - adminCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentSettings"
      responses:
        "200":
          description: 修改后的评论设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /link-reports:
    get:
      operationId: listLinkReports
      summary: 下载地址失效反馈
      tags: [content]
      security:
        - adminCookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ReportStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 反馈分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkReportPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /link-reports/{id}:
    patch:
      operationId: updateLinkReport
      summary: 处理失效反馈
      description: 修改下载地址请到内容编辑页，这里只记录处理结果。
      tags: [content]
      security:
        - adminCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLinkReportRequest"
      responses:
        "204":
          description: 已处理
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /membership/plans:
    get:
      operationId: listMembershipPlans
      summary: 会员套餐列表
      tags: [membership]
      security:
        - adminCookieAuth: []
      responses:
        "200":
          description: 全部套餐，按等级和排序
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createMembershipPlan
      summary: 新建会员套餐
      tags: [membership]
      security:
        - adminCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "201":
          description: 新建的套餐
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipPlan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /membership/plans/{id}:
    put:
      operationId: updateMembershipPlan
      summary: 修改会员套餐
      description: 已下单的订单按下单时的快照计价和开通，不受修改影响。
      tags: [membership]
      security:
        - adminCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "200":
          description: 修改后的套餐
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipPlan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteMembershipPlan
      summary: 删除会员套餐
      tags: [membership]
      security:
        - adminCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /orders:
    get:
      operationId: listOrders
      summary: 订单列表
      tags: [orders]
      security:
        - adminCookieAuth: []
      parameters:
        - name: orderNo
          in: query
          description: 订单号，支持前缀匹配
          schema:
            type: string
        - name: email
          in: query
          description: 下单用户的邮箱，精确匹配
          schema:
            type: string
        - name: userId
          in: query
          schema:
            type: integer
            format: int64
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/OrderType"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: payMethod
          in: query
          schema:
            type: string
            enum: [wechat, alipay, balance]
        - name: duplicate
          in: query
          description: 只看有重复支付、需要人工退款的订单
          schema:
            type: boolean
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 订单分页列表，新的在前
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrderPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /orders/{orderNo}:
    get:
      operationId: getOrder
      summary: 订单详情
      tags: [orders]
      security:
        - adminCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderNoPath"
      responses:
        "200":
          description: 订单、快照与支付记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrderDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /orders/{orderNo}/refund:
    post:
      operationId: refundOrder
      summary: 退款
      description: |
        订单改为已退款并收回已购内容。退回余额会写入退款流水；原路退回表示已在支付平台操作，这里只记录。
        余额支付的订单只能退回余额；充值订单只能原路退回，同时扣回充值的余额；会员订单不自动扣减时长。
        操作会写入后台日志。
      tags: [orders]
      security:
        - adminCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderNoPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundRequest"
      responses:
        "200":
          description: 退款后的订单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /orders/{orderNo}/sync:
    post:
      operationId: syncOrder
      summary: 查询渠道补单
      description: 向支付渠道查询待支付订单，已到账则确认并发放权益。
      tags: [orders]
      security:
        - adminCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderNoPath"
      responses:
        "200":
          description: 查询后的订单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

  /orders/{orderNo}/close:
    post:
      operationId: closeOrder
      summary: 关闭订单
      description: 关闭待支付订单。关闭前先查询一次渠道，已到账的改为确认支付。操作会写入后台日志。
      tags: [orders]
      security:
        - adminCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderNoPath"
      responses:
        "200":
          description: 关闭后的订单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"

  /ledger:
    get:
      operationId: listLedger
      summary: 余额流水
      tags: [orders]
      security:
        - adminCookieAuth: []
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
            format: int64
        - name: bizType
          in: query
          schema:
            $ref: "#/components/schemas/LedgerBizType"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 流水分页列表，新的在前
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLedgerPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/{id}/wallet:
    post:
      operationId: adjustBalance
      summary: 调整用户余额
      description: 写入 admin_adjust 流水，必须填写原因。操作会写入后台日志。
      tags: [users]
      security:
        - adminCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustBalanceRequest"
      responses:
        "200":
          description: 调整后的余额
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /settings/payment:
    get:
      operationId: getPaymentSettings
      summary: 支付设置
      description: 私钥和 APIv3 密钥只返回是否已填写，不返回内容。
      tags: [settings]
      security:
        - adminCookieAuth: []
      responses:
        "200":
          description: 支付设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updatePaymentSettings
      summary: 修改支付设置
      description: |
        密钥字段留空表示不修改。启用的渠道会用填写的参数实际创建一次客户端（微信未填写支付公钥时会下载平台证书），
        参数有误时拒绝保存。私钥和 APIv3 密钥加密后保存。操作会写入后台日志。
      tags: [settings]
      security:
        - adminCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentSettingsInput"
      responses:
        "200":
          description: 保存后的支付设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    adminCookieAuth:
      type: apiKey
      in: cookie
      name: xzji_admin_session

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    OrderNoPath:
      name: orderNo
      in: path
      required: true
      schema:
        type: string
        maxLength: 32
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: 参数不正确
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 未登录或凭证无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 与现有数据冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: 操作太频繁
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: 依赖的服务暂时不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    CsrfToken:
      type: object
      required: [token]
      properties:
        token:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string

    AdminProfile:
      type: object
      required: [id, email, nickname]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        nickname:
          type: string

    SessionState:
      type: object
      properties:
        admin:
          $ref: "#/components/schemas/AdminProfile"

    Role:
      type: string
      enum: [user, admin]

    UserStatus:
      type: string
      enum: [active, banned]

    UserItem:
      type: object
      required: [id, email, nickname, role, status, emailVerified, balance, createdAt]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        nickname:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/UserStatus"
        emailVerified:
          type: boolean
        inviterId:
          type: integer
          format: int64
          nullable: true
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        membership:
          $ref: "#/components/schemas/UserMembership"
        balance:
          type: integer
          format: int64
          description: 余额（分）
        createdAt:
          type: string
          format: date-time

    UserPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserItem"
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer

    UpdateUserRequest:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/UserStatus"

    SystemStatus:
      type: object
      required: [siteName, version, goVersion, uptimeSeconds, database]
      properties:
        siteName:
          type: string
          example: XZJI
        version:
          type: string
          example: 0.1.0
        goVersion:
          type: string
          example: go1.27.1
        uptimeSeconds:
          type: integer
          format: int64
        database:
          $ref: "#/components/schemas/DatabaseStatus"

    DatabaseStatus:
      type: object
      required: [status, version, migration]
      properties:
        status:
          type: string
          enum: [up, down]
        version:
          type: string
          description: 数据库服务端版本
          example: 12.3.3-MariaDB
        migration:
          type: integer
          format: int64
          description: 当前数据库迁移版本号

    PostType:
      type: string
      enum: [article, resource]

    PostStatus:
      type: string
      enum: [draft, published, trash]

    EditableStatus:
      type: string
      enum: [draft, published]
      description: 移入回收站和恢复使用单独的接口

    Media:
      type: object
      required: [id, url, width, height, mime, size, color]
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
        width:
          type: integer
        height:
          type: integer
        mime:
          type: string
        size:
          type: integer
          format: int64
        color:
          type: string
          description: 主色（#RRGGBB），图片过大时为空

    AdminCategory:
      type: object
      required: [id, parentId, name, slug, icon, color, description, sort, seoTitle, seoDescription, postCount]
      properties:
        id:
          type: integer
          format: int64
        parentId:
          type: integer
          format: int64
          nullable: true
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
        color:
          type: string
        description:
          type: string
        sort:
          type: integer
        seoTitle:
          type: string
        seoDescription:
          type: string
        postCount:
          type: integer
          format: int64

    AdminCategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminCategory"

    CategoryInput:
      type: object
      required: [name, slug]
      properties:
        parentId:
          type: integer
          format: int64
          nullable: true
          description: 只支持两级，父分类必须是顶级分类
        name:
          type: string
        slug:
          type: string
          description: 小写字母、数字和短横线，用于网址 /category/{slug}/
        icon:
          type: string
        color:
          type: string
          description: blue / red / orange / green / purple / gold / vip，留空使用默认色
        description:
          type: string
        sort:
          type: integer
          description: 越小越靠前
        seoTitle:
          type: string
        seoDescription:
          type: string

    AdminTag:
      type: object
      required: [id, name, slug, postCount, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        postCount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time

    AdminTagPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminTag"
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer

    TagInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        slug:
          type: string
          description: 用于网址 /tag/{slug}/，留空时由名称生成

    CategoryRef:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string

    Author:
      type: object
      required: [id, nickname]
      properties:
        id:
          type: integer
          format: int64
        nickname:
          type: string

    AdminPostItem:
      type: object
      required: [id, type, title, status, pinned, category, author, viewCount, commentCount, publishedAt, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/PostType"
        title:
          type: string
        status:
          $ref: "#/components/schemas/PostStatus"
        pinned:
          type: boolean
        category:
          $ref: "#/components/schemas/CategoryRef"
        author:
          $ref: "#/components/schemas/Author"
        cover:
          $ref: "#/components/schemas/Media"
        viewCount:
          type: integer
        commentCount:
          type: integer
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdminPostPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminPostItem"
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer

    Attr:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
        value:
          type: string

    ChangelogEntry:
      type: object
      required: [version, date, note]
      properties:
        version:
          type: string
        date:
          type: string
          description: YYYY-MM-DD，可以为空
        note:
          type: string

    AdminResource:
      type: object
      required: [platform, version, fileSize, attrs, changelog, downloadCond, links]
      properties:
        downloadCond:
          type: string
          description: 下载区解锁条件：public / login / comment / paid / member:N
        links:
          type: array
          items:
            $ref: "#/components/schemas/AdminLink"
        platform:
          type: string
        version:
          type: string
        fileSize:
          type: string
        icon:
          $ref: "#/components/schemas/Media"
        attrs:
          type: array
          items:
            $ref: "#/components/schemas/Attr"
        changelog:
          type: array
          items:
            $ref: "#/components/schemas/ChangelogEntry"

    AdminPost:
      type: object
      required: [id, type, title, summary, contentHtml, categoryId, tags, status, pinned, price, memberFreeRank, memberDiscount, seoTitle, seoKeywords, seoDescription, publishedAt, author, createdAt, updatedAt]
      properties:
        price:
          type: integer
          format: int64
          description: 单独购买的价格（分），0 表示不能单独购买
        memberFreeRank:
          type: integer
          description: 会员等级达到该值即免费，0 表示会员也不免费
        memberDiscount:
          type: boolean
          description: 等级不够免费的会员是否享受等级折扣
        id:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/PostType"
        title:
          type: string
        summary:
          type: string
        contentHtml:
          type: string
        cover:
          $ref: "#/components/schemas/Media"
        categoryId:
          type: integer
          format: int64
        tags:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/PostStatus"
        pinned:
          type: boolean
        seoTitle:
          type: string
        seoKeywords:
          type: string
        seoDescription:
          type: string
