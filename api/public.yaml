openapi: 3.0.3
info:
  title: XZJI 前台接口
  version: 1.0.0
  description: |
    前台网页、App、小程序共用的接口。
    出现不兼容变更时升级路径版本（/api/v2），旧版本保留一段时间。

    身份凭证：网页使用 HttpOnly Cookie（xzji_session）；App 和小程序使用 Authorization: Bearer 令牌。
    网页发起写请求时需要带 X-CSRF-Token 请求头，令牌通过 GET /auth/csrf 获取。
servers:
  - url: /api/v1
tags:
  - name: system
    description: 系统
  - name: auth
    description: 注册、登录与找回密码
  - name: me
    description: 当前登录用户
  - name: site
    description: 站点与运营位
  - name: content
    description: 分类、标签与内容
paths:
  /health:
    get:
      operationId: getHealth
      summary: 健康检查
      tags: [system]
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: 依赖的服务不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/csrf:
    get:
      operationId: getCsrfToken
      summary: 获取 CSRF 令牌
      description: 同时写入 HttpOnly 的 CSRF Cookie。已有有效 Cookie 时返回同一个令牌。
      tags: [auth]
      responses:
        "200":
          description: CSRF 令牌
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"

  /auth/session:
    get:
      operationId: getSession
      summary: 当前登录状态
      description: 未登录时不返回 user 字段，也不返回 401，供页面判断登录状态，避免匿名访问产生大量 401。
      tags: [auth]
      responses:
        "200":
          description: 登录状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionState"

  /auth/email-codes:
    post:
      operationId: sendEmailCode
      summary: 发送邮箱验证码
      description: 找回密码时，邮箱未注册也返回成功，避免泄露注册情况。
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendEmailCodeRequest"
      responses:
        "204":
          description: 已发送
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/register:
    post:
      operationId: register
      summary: 邮箱注册
      description: 注册成功后直接登录。
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login:
    post:
      operationId: login
      summary: 邮箱密码登录
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/logout:
    post:
      operationId: logout
      summary: 退出登录
      tags: [auth]
      responses:
        "204":
          description: 已退出

  /auth/password-reset:
    post:
      operationId: resetPassword
      summary: 通过邮箱验证码重设密码
      description: 重设后该账号的所有登录会话失效。
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: 已重设
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /me:
    get:
      operationId: getMe
      summary: 当前登录用户
      tags: [me]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: 用户信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateMe
      summary: 修改个人资料
      tags: [me]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: 修改后的用户信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/password:
    post:
      operationId: changePassword
      summary: 修改密码
      description: 修改后其他设备上的登录会话失效，当前会话保留。
      tags: [me]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: 已修改
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /site/home:
    get:
      operationId: getHome
      summary: 首页运营位
      description: 横幅和公告，在后台“首页设置”中修改。
      tags: [site]
      responses:
        "200":
          description: 首页运营位
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Home"

  /categories:
    get:
      operationId: listCategories
      summary: 分类树
      description: 按排序值返回全部分类。postCount 为已发布的内容数，包含子分类。
      tags: [content]
      responses:
        "200":
          description: 分类树
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"

  /posts:
    get:
      operationId: listPosts
      summary: 内容列表
      description: 只返回已发布的内容。按分类筛选时包含子分类。
      tags: [content]
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/PostType"
        - name: category
          in: query
          description: 分类 slug
          schema:
            type: string
        - name: tag
          in: query
          description: 标签 slug
          schema:
            type: string
        - name: platform
          in: query
          description: 资源平台，如 Windows
          schema:
            type: string
        - name: q
          in: query
          description: 搜索关键词，匹配标题和摘要
          schema:
            type: string
            maxLength: 50
        - name: sort
          in: query
          description: latest 置顶在前，再按发布时间倒序；views 按浏览量倒序
          schema:
            type: string
            enum: [latest, views]
            default: latest
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
      responses:
        "200":
          description: 内容分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}:
    get:
      operationId: getPost
      summary: 内容详情
      description: 只包含公开部分，未发布的内容返回 404。
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 内容详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/related:
    get:
      operationId: listRelatedPosts
      summary: 相关推荐
      description: 同分类下最新发布的其他内容。
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 6
      responses:
        "200":
          description: 相关内容
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostList"
        "404":
          $ref: "#/components/responses/NotFound"

  /tags:
    get:
      operationId: listTags
      summary: 热门标签
      description: 按已发布的内容数倒序。
      tags: [content]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: 标签列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"

  /tags/{slug}:
    get:
      operationId: getTag
      summary: 标签详情
      tags: [content]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 标签
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "404":
          $ref: "#/components/responses/NotFound"

  /platforms:
    get:
      operationId: listPlatforms
      summary: 资源平台
      description: 已发布资源中出现过的平台及数量，用于列表页筛选。
      tags: [content]
      parameters:
        - name: category
          in: query
          description: 分类 slug，包含子分类
          schema:
            type: string
      responses:
        "200":
          description: 平台列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformList"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: xzji_session
    bearerAuth:
      type: http
      scheme: bearer

  responses:
    BadRequest:
      description: 参数不正确
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 未登录或凭证无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 没有权限
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 与现有数据冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: 操作太频繁
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status, version, database, time]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: ok 表示全部正常；degraded 表示有依赖不可用
        version:
          type: string
          example: 0.1.0
        database:
          type: string
          enum: [up, down]
        time:
          type: string
          format: date-time

    CsrfToken:
      type: object
      required: [token]
      properties:
        token:
          type: string

    ClientType:
      type: string
      enum: [web, app]
      default: web
      description: web 使用 Cookie；app 在响应体中返回令牌

    SendEmailCodeRequest:
      type: object
      required: [email, purpose]
      properties:
        email:
          type: string
          example: you@example.com
        purpose:
          type: string
          enum: [register, reset_password]

    RegisterRequest:
      type: object
      required: [email, code, password]
      properties:
        email:
          type: string
        code:
          type: string
          description: 6 位邮箱验证码
        password:
          type: string
          description: 至少 8 位，同时包含字母和数字
        nickname:
          type: string
          description: 不填时取邮箱 @ 前面的部分
        inviterId:
          type: integer
          format: int64
          description: 邀请人 ID，来自推广链接 ?ref=
        client:
          $ref: "#/components/schemas/ClientType"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
        remember:
          type: boolean
          default: true
          description: true 时 30 天内免登录；false 时关闭浏览器后失效
        client:
          $ref: "#/components/schemas/ClientType"

    ResetPasswordRequest:
      type: object
      required: [email, code, password]
      properties:
        email:
          type: string
        code:
          type: string
        password:
          type: string

    UpdateProfileRequest:
      type: object
      required: [nickname]
      properties:
        nickname:
          type: string

    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string

    User:
      type: object
      required: [id, email, nickname, role, emailVerified, createdAt]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        nickname:
          type: string
        role:
          type: string
          enum: [user, admin]
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time

    SessionState:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"

    AuthResult:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
          description: "仅 client=app 时返回，之后放在 Authorization: Bearer 请求头中"

    PostType:
      type: string
      enum: [article, resource]
      description: article 文章；resource 资源

    Image:
      type: object
      required: [url, width, height]
      properties:
        url:
          type: string
        width:
          type: integer
        height:
          type: integer
        color:
          type: string
          description: 主色（#RRGGBB），用于给软件图标配底色，可能为空
          example: "#2F6BFF"

    Banner:
      type: object
      required: [tag, title, subtitle, buttonText, link]
      properties:
        tag:
          type: string
          description: 标题上方的小标签，可能为空
        title:
          type: string
          description: 标题，可能包含换行
        subtitle:
          type: string
        buttonText:
          type: string
        link:
          type: string
        image:
          $ref: "#/components/schemas/Image"

    Home:
      type: object
      required: [banners, notice]
      properties:
        banners:
          type: array
          items:
            $ref: "#/components/schemas/Banner"
        notice:
          type: string
          description: 公告，按换行分段

    CategoryNode:
      type: object
      required: [id, name, slug, icon, color, description, seoTitle, seoDescription, postCount, children]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
          description: 图标名，对应 icons.svg 中的 i-{icon}
        color:
          type: string
          description: 渐变色 blue / red / orange / green / purple / gold / vip，可能为空
        description:
          type: string
        seoTitle:
          type: string
        seoDescription:
          type: string
        postCount:
          type: integer
          format: int64
        children:
          type: array
          items:
            $ref: "#/components/schemas/CategoryNode"

    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CategoryNode"

    CategoryRef:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string

    TagRef:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string

    Author:
      type: object
      required: [id, nickname]
      properties:
        id:
          type: integer
          format: int64
        nickname:
          type: string

    ResourceBrief:
      type: object
      required: [platform, version, fileSize]
      properties:
        platform:
          type: string
        version:
          type: string
        fileSize:
          type: string
        icon:
          $ref: "#/components/schemas/Image"

    PostCard:
      type: object
      required: [id, type, title, summary, category, tags, author, pinned, viewCount, commentCount, publishedAt]
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/PostType"
        title:
          type: string
        summary:
          type: string
        cover:
          $ref: "#/components/schemas/Image"
        category:
          $ref: "#/components/schemas/CategoryRef"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagRef"
        author:
          $ref: "#/components/schemas/Author"
        pinned:
          type: boolean
        viewCount:
          type: integer
        commentCount:
          type: integer
        publishedAt:
          type: string
          format: date-time
        resource:
          $ref: "#/components/schemas/ResourceBrief"

    PostPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PostCard"
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer

    PostList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PostCard"

    TocItem:
      type: object
      required: [id, text, level]
      properties:
        id:
          type: string
          description: 正文中对应标题的 id
        text:
          type: string
        level:
          type: integer
          description: 2 或 3

    Attr:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
          example: 兼容系统
        value:
          type: string
          example: Windows 7+

    ChangelogEntry:
      type: object
      required: [version, date, note]
      properties:
        version:
          type: string
        date:
          type: string
          description: YYYY-MM-DD，可能为空
        note:
          type: string

    ResourceDetail:
      type: object
      required: [platform, version, fileSize, attrs, changelog]
      properties:
        platform:
          type: string
        version:
          type: string
        fileSize:
          type: string
        icon:
          $ref: "#/components/schemas/Image"
        attrs:
          type: array
          items:
            $ref: "#/components/schemas/Attr"
        changelog:
          type: array
          description: 新的在前
          items:
            $ref: "#/components/schemas/ChangelogEntry"

    PostDetail:
      type: object
      required: [id, type, title, summary, contentHtml, toc, category, tags, author, pinned, viewCount, commentCount, seoTitle, seoKeywords, seoDescription, publishedAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/PostType"
        title:
          type: string
        summary:
          type: string
        contentHtml:
          type: string
          description: 已过滤的正文 HTML，只含公开内容
        toc:
          type: array
          items:
            $ref: "#/components/schemas/TocItem"
        cover:
          $ref: "#/components/schemas/Image"
        category:
          $ref: "#/components/schemas/CategoryRef"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagRef"
        author:
          $ref: "#/components/schemas/Author"
        pinned:
          type: boolean
        viewCount:
          type: integer
        commentCount:
          type: integer
        seoTitle:
          type: string
        seoKeywords:
          type: string
        seoDescription:
          type: string
        publishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resource:
          $ref: "#/components/schemas/ResourceDetail"

    Tag:
      type: object
      required: [id, name, slug, postCount]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        postCount:
          type: integer
          format: int64

    TagList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tag"

    PlatformCount:
      type: object
      required: [name, count]
      properties:
        name:
          type: string
        count:
          type: integer
          format: int64

    PlatformList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlatformCount"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 业务错误码，前端据此判断错误类型
              example: INVALID_CREDENTIALS
            message:
              type: string
              description: 可直接展示给用户的提示
              example: 邮箱或密码不正确
