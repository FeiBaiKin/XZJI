openapi: 3.0.3
info:
  title: XZJI 前台接口
  version: 1.0.0
  description: |
    前台网页、App、小程序共用的接口。
    出现不兼容变更时升级路径版本（/api/v2），旧版本保留一段时间。

    身份凭证：网页使用 HttpOnly Cookie（xzji_session）；App 和小程序使用 Authorization: Bearer 令牌。
    网页发起写请求时需要带 X-CSRF-Token 请求头，令牌通过 GET /auth/csrf 获取。
servers:
  - url: /api/v1
tags:
  - name: system
    description: 系统
  - name: auth
    description: 注册、登录与找回密码
  - name: me
    description: 当前登录用户
  - name: site
    description: 站点与运营位
  - name: content
    description: 分类、标签与内容
  - name: access
    description: 解锁、下载与失效反馈
  - name: comments
    description: 评论
  - name: membership
    description: 会员
  - name: orders
    description: 订单与支付
paths:
  /health:
    get:
      operationId: getHealth
      summary: 健康检查
      tags: [system]
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: 依赖的服务不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/csrf:
    get:
      operationId: getCsrfToken
      summary: 获取 CSRF 令牌
      description: 同时写入 HttpOnly 的 CSRF Cookie。已有有效 Cookie 时返回同一个令牌。
      tags: [auth]
      responses:
        "200":
          description: CSRF 令牌
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"

  /auth/session:
    get:
      operationId: getSession
      summary: 当前登录状态
      description: 未登录时不返回 user 字段，也不返回 401，供页面判断登录状态，避免匿名访问产生大量 401。
      tags: [auth]
      responses:
        "200":
          description: 登录状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionState"

  /auth/email-codes:
    post:
      operationId: sendEmailCode
      summary: 发送邮箱验证码
      description: 找回密码时，邮箱未注册也返回成功，避免泄露注册情况。
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendEmailCodeRequest"
      responses:
        "204":
          description: 已发送
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/register:
    post:
      operationId: register
      summary: 邮箱注册
      description: 注册成功后直接登录。
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login:
    post:
      operationId: login
      summary: 邮箱密码登录
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/logout:
    post:
      operationId: logout
      summary: 退出登录
      tags: [auth]
      responses:
        "204":
          description: 已退出

  /auth/password-reset:
    post:
      operationId: resetPassword
      summary: 通过邮箱验证码重设密码
      description: 重设后该账号的所有登录会话失效。
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: 已重设
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /me:
    get:
      operationId: getMe
      summary: 当前登录用户
      tags: [me]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: 用户信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateMe
      summary: 修改个人资料
      tags: [me]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: 修改后的用户信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/password:
    post:
      operationId: changePassword
      summary: 修改密码
      description: 修改后其他设备上的登录会话失效，当前会话保留。
      tags: [me]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: 已修改
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /site/home:
    get:
      operationId: getHome
      summary: 首页运营位
      description: 横幅和公告，在后台“首页设置”中修改。
      tags: [site]
      responses:
        "200":
          description: 首页运营位
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Home"

  /site/info:
    get:
      operationId: getSiteInfo
      summary: 站点信息
      description: 页脚用的站点信息，在后台“站点设置”中修改。
      tags: [site]
      responses:
        "200":
          description: 站点信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteInfo"

  /site/documents:
    get:
      operationId: getSiteDocuments
      summary: 用户协议与隐私政策
      description: 站长填写的正文，未填写时返回空字符串，前台显示“站长尚未填写”。
      tags: [site]
      responses:
        "200":
          description: 两份文档的正文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteDocuments"

  /seo/sitemap:
    get:
      operationId: getSitemap
      summary: sitemap 数据
      description: |
        已发布内容的 ID 和更新时间，以及全部分类和有内容的标签的 slug，供前台生成 sitemap.xml。
        这个量级一次返回即可；站点超过 5 万条 URL 时再拆成多个 sitemap 和索引文件。
      tags: [site]
      responses:
        "200":
          description: sitemap 数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SitemapData"

  /categories:
    get:
      operationId: listCategories
      summary: 分类树
      description: 按排序值返回全部分类。postCount 为已发布的内容数，包含子分类。
      tags: [content]
      responses:
        "200":
          description: 分类树
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"

  /posts:
    get:
      operationId: listPosts
      summary: 内容列表
      description: 只返回已发布的内容。按分类筛选时包含子分类。
      tags: [content]
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/PostType"
        - name: category
          in: query
          description: 分类 slug
          schema:
            type: string
        - name: tag
          in: query
          description: 标签 slug
          schema:
            type: string
        - name: platform
          in: query
          description: 资源平台，如 Windows
          schema:
            type: string
        - name: access
          in: query
          description: 按下载区解锁方式筛选资源：free 免费 / login 登录或评论 / vip 会员免费 / paid 付费
          schema:
            type: string
            enum: [free, login, vip, paid]
        - name: q
          in: query
          description: 搜索关键词，匹配标题和摘要
          schema:
            type: string
            maxLength: 50
        - name: sort
          in: query
          description: latest 置顶在前，再按发布时间倒序；views 按浏览量倒序
          schema:
            type: string
            enum: [latest, views]
            default: latest
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
      responses:
        "200":
          description: 内容分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}:
    get:
      operationId: getPost
      summary: 内容详情
      description: 只包含公开部分，未发布的内容返回 404。
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 内容详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/related:
    get:
      operationId: listRelatedPosts
      summary: 相关推荐
      description: 同分类下最新发布的其他内容。
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 6
      responses:
        "200":
          description: 相关内容
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostList"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/view:
    post:
      operationId: recordPostView
      summary: 上报一次浏览量
      description: |
        由浏览器在详情页加载完成后调用，不需要登录。命中页面缓存时服务端不执行，只能在浏览器端统计。
        同一 IP 对同一内容 30 分钟内只计一次；后端先在内存里累加，每分钟批量写库。
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: 已记录（内容不存在时同样返回 204，避免探测）

  /tags:
    get:
      operationId: listTags
      summary: 热门标签
      description: 按已发布的内容数倒序。
      tags: [content]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: 标签列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"

  /tags/{slug}:
    get:
      operationId: getTag
      summary: 标签详情
      tags: [content]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 标签
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "404":
          $ref: "#/components/responses/NotFound"

  /platforms:
    get:
      operationId: listPlatforms
      summary: 资源平台
      description: 已发布资源中出现过的平台及数量，用于列表页筛选。
      tags: [content]
      parameters:
        - name: category
          in: query
          description: 分类 slug，包含子分类
          schema:
            type: string
      responses:
        "200":
          description: 平台列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformList"
        "404":
          $ref: "#/components/responses/NotFound"

  /membership/levels:
    get:
      operationId: listMembershipLevels
      summary: 会员等级
      description: 只返回启用的等级，按 rank 从低到高。用于显示“VIP 免费”等标识和解锁提示。
      tags: [membership]
      responses:
        "200":
          description: 会员等级
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LevelList"

  /posts/{id}/unlocked:
    get:
      operationId: getUnlockState
      summary: 当前用户的解锁情况
      description: |
        返回隐藏块和下载区对当前访问者是否已解锁，已解锁的隐藏块附带内容。
        每次请求实时判定，不能缓存；未登录也可以调用。
      tags: [access]
      parameters:
        - $ref: "#/components/parameters/PostIdPath"
      responses:
        "200":
          description: 解锁情况
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlockState"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/links/{linkId}/download:
    post:
      operationId: downloadLink
      summary: 获取下载地址
      description: |
        判定下载区的解锁条件，并记录一次下载。靠会员身份免费下载时检查每日次数，
        同一篇内容当天重复获取不重复计数。
      tags: [access]
      parameters:
        - $ref: "#/components/parameters/PostIdPath"
        - $ref: "#/components/parameters/LinkIdPath"
      responses:
        "200":
          description: 下载地址
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /posts/{id}/links/{linkId}/reports:
    post:
      operationId: reportLink
      summary: 反馈下载地址失效
      tags: [access]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostIdPath"
        - $ref: "#/components/parameters/LinkIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkReportRequest"
      responses:
        "204":
          description: 已收到
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /posts/{id}/comments:
    get:
      operationId: listComments
      summary: 评论列表
      description: 一级评论按时间倒序分页，回复按时间顺序放在 replies 里。登录用户还能看到自己待审核的评论。
      tags: [comments]
      parameters:
        - $ref: "#/components/parameters/PostIdPath"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: 评论分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentPage"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createComment
      summary: 发表评论
      description: 只允许纯文本。按后台设置的审核方式，可能需要审核后才显示。
      tags: [comments]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: 发表成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /membership/plans:
    get:
      operationId: listMembershipPlans
      summary: 会员套餐
      description: 启用的等级及其启用的套餐，按 rank 从低到高。用于会员页展示价格，具体应付金额以报价接口为准。
      tags: [membership]
      responses:
        "200":
          description: 等级与套餐
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanCatalog"

  /orders/quote:
    get:
      operationId: quoteOrder
      summary: 下单前报价
      description: |
        按当前用户的身份计算价格明细（会员折扣、续费顺延、升级折算），同时返回各支付方式是否可用。
        只计算不下单；金额一律以服务端计算为准。
      tags: [orders]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/OrderType"
        - name: targetId
          in: query
          description: 内容 ID 或套餐 ID，充值不用传
          schema:
            type: integer
            format: int64
        - name: amount
          in: query
          description: 充值金额（分），1 到 5000 元
          schema:
            type: integer
            format: int64
        - name: scene
          in: query
          schema:
            $ref: "#/components/schemas/PayScene"
      responses:
        "200":
          description: 价格明细
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderQuote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /orders:
    post:
      operationId: createOrder
      summary: 下单并发起支付
      description: |
        按服务端计算的价格创建订单（30 分钟内未支付自动关闭），并用选定的方式发起支付：
        余额支付直接完成；微信、支付宝返回二维码内容或跳转地址，之后轮询订单状态确认结果。
      tags: [orders]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: 订单与支付操作
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"

  /orders/{orderNo}:
    get:
      operationId: getOrder
      summary: 订单详情
      description: 支付页轮询用。待支付的订单会顺便向支付渠道查询一次，回调延迟时也能尽快确认。
      tags: [orders]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderNoPath"
      responses:
        "200":
          description: 订单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /orders/{orderNo}/pay:
    post:
      operationId: payOrder
      summary: 继续支付
      description: 为自己的待支付订单重新发起支付，可以换一种支付方式；换渠道时会先关闭原渠道的交易。
      tags: [orders]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderNoPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayOrderRequest"
      responses:
        "200":
          description: 订单与支付操作
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"

  /orders/{orderNo}/mock-pay:
    post:
      operationId: mockPayOrder
      summary: 模拟支付成功（仅开发环境）
      description: 后端开启模拟支付时可用，模拟在微信或支付宝完成付款；生产环境始终返回 404。
      tags: [orders]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderNoPath"
      responses:
        "200":
          description: 订单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /pay/notify/{channel}:
    post:
      operationId: payNotify
      summary: 支付渠道异步回调
      description: |
        由微信支付、支付宝的服务器调用，请求体格式由渠道决定（微信为 JSON，支付宝为表单），
        验签通过并处理完成后返回纯文本 success；处理失败返回错误，渠道会稍后重试。
      tags: [orders]
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
            enum: [wechat, alipay]
      responses:
        "200":
          description: 已处理
          content:
            text/plain:
              schema:
                type: string
                example: success
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /me/overview:
    get:
      operationId: getAccountOverview
      summary: 用户中心概览
      tags: [me]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: 余额、已购、今日下载
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/orders:
    get:
      operationId: listMyOrders
      summary: 我的订单
      tags: [me]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 订单分页列表，新的在前
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/purchases:
    get:
      operationId: listMyPurchases
      summary: 已购内容
      tags: [me]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 已购内容分页列表，新的在前
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasePage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/wallet/ledger:
    get:
      operationId: listMyLedger
      summary: 余额明细
      tags: [me]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 余额流水分页列表，新的在前
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  parameters:
    PostIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    LinkIdPath:
      name: linkId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    OrderNoPath:
      name: orderNo
      in: path
      required: true
      schema:
        type: string
        maxLength: 32
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: xzji_session
    bearerAuth:
      type: http
      scheme: bearer

  responses:
    BadRequest:
      description: 参数不正确
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 未登录或凭证无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 没有权限
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 与现有数据冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: 操作太频繁
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: 依赖的服务暂时不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status, version, database, time]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: ok 表示全部正常；degraded 表示有依赖不可用
        version:
          type: string
          example: 0.1.0
        database:
          type: string
          enum: [up, down]
        time:
          type: string
          format: date-time

    CsrfToken:
      type: object
      required: [token]
      properties:
        token:
          type: string

    ClientType:
      type: string
      enum: [web, app]
      default: web
      description: web 使用 Cookie；app 在响应体中返回令牌

    SendEmailCodeRequest:
      type: object
      required: [email, purpose]
      properties:
        email:
          type: string
          example: you@example.com
        purpose:
          type: string
          enum: [register, reset_password]

    RegisterRequest:
      type: object
      required: [email, code, password]
      properties:
        email:
          type: string
        code:
          type: string
          description: 6 位邮箱验证码
        password:
          type: string
          description: 至少 8 位，同时包含字母和数字
        nickname:
          type: string
          description: 不填时取邮箱 @ 前面的部分
        inviterId:
          type: integer
          format: int64
          description: 邀请人 ID，来自推广链接 ?ref=
        client:
          $ref: "#/components/schemas/ClientType"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
        remember:
          type: boolean
          default: true
          description: true 时 30 天内免登录；false 时关闭浏览器后失效
        client:
          $ref: "#/components/schemas/ClientType"

    ResetPasswordRequest:
      type: object
      required: [email, code, password]
      properties:
        email:
          type: string
        code:
          type: string
        password:
          type: string

    UpdateProfileRequest:
      type: object
      required: [nickname]
      properties:
        nickname:
          type: string

    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string

    User:
      type: object
      required: [id, email, nickname, role, emailVerified, createdAt]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        nickname:
          type: string
        role:
          type: string
          enum: [user, admin]
        emailVerified:
          type: boolean
        membership:
          $ref: "#/components/schemas/UserMembership"
        createdAt:
          type: string
          format: date-time

    SessionState:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"

    AuthResult:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
          description: "仅 client=app 时返回，之后放在 Authorization: Bearer 请求头中"

    PostType:
      type: string
      enum: [article, resource]
      description: article 文章；resource 资源

    Image:
      type: object
      required: [url, width, height]
      properties:
        url:
          type: string
        width:
          type: integer
        height:
          type: integer
        color:
          type: string
          description: 主色（#RRGGBB），用于给软件图标配底色，可能为空
          example: "#2F6BFF"
        variants:
          type: array
          description: 各尺寸缩略图（WebP），按宽度从小到大；没有时直接用 url 的原图
          items:
            $ref: "#/components/schemas/ImageVariant"

    ImageVariant:
      type: object
      required: [url, width, height]
      properties:
        url:
          type: string
        width:
          type: integer
        height:
          type: integer

    Banner:
      type: object
      required: [tag, title, subtitle, buttonText, link]
      properties:
        tag:
          type: string
          description: 标题上方的小标签，可能为空
        title:
          type: string
          description: 标题，可能包含换行
        subtitle:
          type: string
        buttonText:
          type: string
        link:
          type: string
        image:
          $ref: "#/components/schemas/Image"

    Home:
      type: object
      required: [banners, notice]
      properties:
        banners:
          type: array
          items:
            $ref: "#/components/schemas/Banner"
        notice:
          type: string
          description: 公告，按换行分段

    SiteInfo:
      type: object
      required: [footerAbout, icp, policeIcp]
      properties:
        footerAbout:
          type: string
          description: 页脚简介
        icp:
          type: string
          description: ICP 备案号
        policeIcp:
          type: string
          description: 公安备案号，未填写时为空字符串

    SiteDocuments:
      type: object
      required: [terms, privacy]
      properties:
        terms:
          type: string
          description: 用户协议正文（HTML），未填写时为空字符串
        privacy:
          type: string
          description: 隐私政策正文（HTML），未填写时为空字符串

    SitemapData:
      type: object
      required: [posts, categories, tags]
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/SitemapPost"
        categories:
          type: array
          description: 全部分类的 slug
          items:
            type: string
        tags:
          type: array
          description: 有已发布内容的标签的 slug
          items:
            type: string

    SitemapPost:
      type: object
      required: [id, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time

    CategoryNode:
      type: object
      required: [id, name, slug, icon, color, description, seoTitle, seoDescription, postCount, children]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
          description: 图标名，对应 icons.svg 中的 i-{icon}
        color:
          type: string
          description: 渐变色 blue / red / orange / green / purple / gold / vip，可能为空
        description:
          type: string
        seoTitle:
          type: string
        seoDescription:
          type: string
        postCount:
          type: integer
          format: int64
        children:
          type: array
          items:
            $ref: "#/components/schemas/CategoryNode"

    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CategoryNode"

    CategoryRef:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string

    TagRef:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string

    Author:
      type: object
      required: [id, nickname]
      properties:
        id:
          type: integer
          format: int64
        nickname:
          type: string

    ResourceBrief:
      type: object
      required: [platform, version, fileSize, downloadCond]
      properties:
        downloadCond:
          $ref: "#/components/schemas/Cond"
        platform:
          type: string
        version:
          type: string
        fileSize:
          type: string
        icon:
          $ref: "#/components/schemas/Image"

    PostCard:
      type: object
      required: [id, type, title, summary, category, tags, author, pinned, price, memberFreeRank, viewCount, commentCount, publishedAt]
      properties:
        price:
          type: integer
          format: int64
          description: 单独购买的原价（分），0 表示不能单独购买
        memberFreeRank:
          type: integer
          description: 会员等级达到该值即免费，0 表示会员也不免费
        id:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/PostType"
        title:
          type: string
        summary:
          type: string
        cover:
          $ref: "#/components/schemas/Image"
        category:
          $ref: "#/components/schemas/CategoryRef"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagRef"
        author:
          $ref: "#/components/schemas/Author"
        pinned:
          type: boolean
        viewCount:
          type: integer
        commentCount:
          type: integer
        publishedAt:
          type: string
          format: date-time
        resource:
          $ref: "#/components/schemas/ResourceBrief"

    PostPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PostCard"
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer

    PostList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PostCard"

    TocItem:
      type: object
      required: [id, text, level]
      properties:
        id:
          type: string
          description: 正文中对应标题的 id
        text:
          type: string
        level:
          type: integer
          description: 2 或 3

    Attr:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
          example: 兼容系统
        value:
          type: string
          example: Windows 7+

    ChangelogEntry:
      type: object
      required: [version, date, note]
      properties:
        version:
          type: string
        date:
          type: string
          description: YYYY-MM-DD，可能为空
        note:
          type: string

    ResourceDetail:
      type: object
      required: [platform, version, fileSize, attrs, changelog, downloadCond, links]
      properties:
        downloadCond:
          $ref: "#/components/schemas/Cond"
        links:
          type: array
          description: 只有网盘名称，地址需要通过下载接口获取
          items:
            $ref: "#/components/schemas/LinkInfo"
        platform:
          type: string
        version:
          type: string
        fileSize:
          type: string
        icon:
          $ref: "#/components/schemas/Image"
        attrs:
          type: array
          items:
            $ref: "#/components/schemas/Attr"
        changelog:
          type: array
          description: 新的在前
          items:
            $ref: "#/components/schemas/ChangelogEntry"

    PostDetail:
      type: object
      required: [id, type, title, summary, contentHtml, toc, category, tags, author, pinned, price, memberFreeRank, memberDiscount, hiddenBlocks, viewCount, commentCount, seoTitle, seoKeywords, seoDescription, publishedAt, updatedAt]
      properties:
        price:
          type: integer
          format: int64
          description: 单独购买的原价（分），0 表示不能单独购买
        memberFreeRank:
          type: integer
          description: 会员等级达到该值即免费，0 表示会员也不免费
        memberDiscount:
          type: boolean
          description: 等级不够免费的会员是否享受等级折扣
        hiddenBlocks:
          type: array
          description: 隐藏块的条件和标题，内容通过 /posts/{id}/unlocked 获取
          items:
            $ref: "#/components/schemas/HiddenBlockInfo"
        id:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/PostType"
        title:
          type: string
        summary:
          type: string
        contentHtml:
          type: string
          description: 已过滤的正文 HTML，只含公开内容；隐藏块的位置是 <div data-hidden-block="序号"></div> 占位符
        toc:
          type: array
          items:
            $ref: "#/components/schemas/TocItem"
        cover:
          $ref: "#/components/schemas/Image"
        category:
          $ref: "#/components/schemas/CategoryRef"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagRef"
        author:
          $ref: "#/components/schemas/Author"
        pinned:
          type: boolean
        viewCount:
          type: integer
        commentCount:
          type: integer
        seoTitle:
          type: string
        seoKeywords:
          type: string
        seoDescription:
          type: string
        publishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resource:
          $ref: "#/components/schemas/ResourceDetail"

    Tag:
      type: object
      required: [id, name, slug, postCount]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        postCount:
          type: integer
          format: int64

    TagList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tag"

    PlatformCount:
      type: object
      required: [name, count]
      properties:
        name:
          type: string
        count:
          type: integer
          format: int64

    PlatformList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlatformCount"

    Cond:
      type: string
      description: 解锁条件：public 公开 / login 登录 / comment 评论审核通过 / paid 购买或会员等级达到免费等级 / member:N 会员等级不低于 N
      example: member:1

    HiddenBlockInfo:
      type: object
      required: [seq, cond, title]
      properties:
        seq:
          type: integer
          description: 对应正文中 <div data-hidden-block="seq"></div> 占位符
        cond:
          $ref: "#/components/schemas/Cond"
        title:
          type: string
          description: 未解锁时显示的标题，可能为空

    LinkInfo:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: 百度网盘
        status:
          type: string
          enum: [ok, broken]

    MembershipLevel:
      type: object
      required: [id, name, rank, discountRate, dailyDownloadLimit]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: VIP
        rank:
          type: integer
          description: 数字越大等级越高
        discountRate:
          type: integer
          description: 购买付费内容的折扣，80 表示 8 折，100 表示不打折
        dailyDownloadLimit:
          type: integer
          description: 每天靠会员身份免费下载的次数，0 表示不限

    LevelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MembershipLevel"

    UserMembership:
      type: object
      required: [levelId, name, rank, expiresAt]
      properties:
        levelId:
          type: integer
          format: int64
        name:
          type: string
        rank:
          type: integer
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: null 表示永久

    Lock:
      type: object
      required: [reason, rank]
      description: 未解锁时需要的操作
      properties:
        reason:
          type: string
          enum: [login, comment, paid, member]
        rank:
          type: integer
          description: paid 时为会员免费等级（0 表示会员也不免费），member 时为要求的会员等级

    ViewerState:
      type: object
      required: [loggedIn, privileged, memberRank, purchased, commented, dailyLimit]
      properties:
        loggedIn:
          type: boolean
        privileged:
          type: boolean
          description: 管理员或作者本人，所有内容可见
        memberRank:
          type: integer
          description: 当前有效的会员等级，非会员为 0
        purchased:
          type: boolean
        commented:
          type: boolean
          description: 在这篇内容下有审核通过的评论
        dailyLimit:
          type: integer
          description: 每天靠会员身份免费下载的次数，0 表示不限

    BlockState:
      type: object
      required: [seq, unlocked]
      properties:
        seq:
          type: integer
        unlocked:
          type: boolean
        contentHtml:
          type: string
          description: 已解锁时返回
        lock:
          $ref: "#/components/schemas/Lock"

    DownloadState:
      type: object
      required: [unlocked, memberFree, usedToday]
      properties:
        unlocked:
          type: boolean
        memberFree:
          type: boolean
          description: 靠会员身份免费下载，计入每日次数
        usedToday:
          type: integer
          description: 今天已用的会员免费下载次数，有每日次数限制时才统计
        lock:
          $ref: "#/components/schemas/Lock"

    UnlockState:
      type: object
      required: [viewer, price, canBuy, hiddenBlocks]
      properties:
        viewer:
          $ref: "#/components/schemas/ViewerState"
        price:
          type: integer
          format: int64
          description: 当前用户单独购买需要支付的金额（分），已按会员折扣计算
        canBuy:
          type: boolean
          description: 是否可以单独购买
        hiddenBlocks:
          type: array
          items:
            $ref: "#/components/schemas/BlockState"
        download:
          $ref: "#/components/schemas/DownloadState"

    DownloadLink:
      type: object
      required: [url, extractCode, unzipPassword, status]
      properties:
        url:
          type: string
        extractCode:
          type: string
        unzipPassword:
          type: string
        status:
          type: string
          enum: [ok, broken]

    LinkReportRequest:
      type: object
      properties:
        reason:
          type: string
          description: 补充说明，可以为空
          maxLength: 200

    CommentAuthor:
      type: object
      required: [id, nickname]
      properties:
        id:
          type: integer
          format: int64
        nickname:
          type: string
        badge:
          type: string
          description: 有效会员的等级名称

    Comment:
      type: object
      required: [id, content, status, createdAt, author, replies]
      properties:
        id:
          type: integer
          format: int64
        content:
          type: string
          description: 纯文本，显示时需要转义
        status:
          type: string
          enum: [approved, pending]
          description: pending 只会出现在作者本人看到的列表里
        createdAt:
          type: string
          format: date-time
        author:
          $ref: "#/components/schemas/CommentAuthor"
        replyTo:
          $ref: "#/components/schemas/CommentAuthor"
        replies:
          type: array
          items:
            $ref: "#/components/schemas/Comment"

    CommentPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        total:
          type: integer
          format: int64
          description: 一级评论数
        page:
          type: integer
        pageSize:
          type: integer

    CreateCommentRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: 2 到 1000 个字
        replyToId:
          type: integer
          format: int64
          description: 要回复的评论，回复楼中楼时传被回复的那条

    MembershipPlan:
      type: object
      required: [id, levelId, name, durationDays, price, originalPrice, badge]
      properties:
        id:
          type: integer
          format: int64
        levelId:
          type: integer
          format: int64
        name:
          type: string
          example: 年卡
        durationDays:
          type: integer
          description: 0 表示永久
        price:
          type: integer
          format: int64
          description: 售价（分）
        originalPrice:
          type: integer
          format: int64
          description: 划线价（分），0 表示不显示
        badge:
          type: string
          description: 角标，如“最多人选”，可能为空

    LevelPlans:
      type: object
      required: [id, name, description, rank, discountRate, dailyDownloadLimit, perks, plans]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          description: 一句话介绍，可能为空
        rank:
          type: integer
        discountRate:
          type: integer
          description: 80 表示 8 折，100 表示不打折
        dailyDownloadLimit:
          type: integer
          description: 每天靠会员身份免费下载的次数，0 表示不限
        perks:
          type: array
          description: 后台填写的自定义权益，显示在折扣、下载次数之后
          items:
            type: string
        plans:
          type: array
          items:
            $ref: "#/components/schemas/MembershipPlan"

    PlanCatalog:
      type: object
      required: [levels]
      properties:
        levels:
          type: array
          items:
            $ref: "#/components/schemas/LevelPlans"

    OrderType:
      type: string
      enum: [post, membership, recharge]
      description: post 购买内容 / membership 开通会员 / recharge 余额充值

    OrderStatus:
      type: string
      enum: [pending, paid, closed, refunded]

    PayMethod:
      type: string
      enum: [wechat, alipay, balance]

    PayScene:
      type: string
      enum: [pc, mobile]
      default: pc
      description: pc 电脑（扫码或跳转收银台）/ mobile 手机浏览器（跳转渠道 H5 页面）

    MembershipQuote:
      type: object
      required: [kind, levelName, planName, rank, durationDays, fromPermanent, remainingDays, remainingValue, convertedDays, deduct, expiresAt]
      description: 购买会员的折算明细
      properties:
        kind:
          type: string
          enum: [new, renew, upgrade]
          description: new 新开通 / renew 同等级续费，到期时间顺延 / upgrade 升级，剩余价值折算
        levelName:
          type: string
        planName:
          type: string
        rank:
          type: integer
        durationDays:
          type: integer
          description: 0 表示永久
        fromLevel:
          type: string
          description: 购买前的有效会员等级，不是会员时不返回
        fromExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: 购买前的到期时间
        fromPermanent:
          type: boolean
        remainingDays:
          type: integer
          description: 升级时原等级剩余的整天数
        remainingValue:
          type: integer
          format: int64
          description: 剩余天数按原等级日均价折算的价值（分）
        convertedDays:
          type: integer
          description: 升级到有限期套餐时，剩余价值折算成新等级的天数
        deduct:
          type: integer
          format: int64
          description: 升级到永久套餐时抵扣的金额（分）
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: 按现在支付计算的到期时间，null 表示永久

    PayMethodState:
      type: object
      required: [method, available]
      properties:
        method:
          $ref: "#/components/schemas/PayMethod"
        available:
          type: boolean
        reason:
          type: string
          description: 不可用的原因，如“余额不足”

    OrderQuote:
      type: object
      required: [type, targetId, title, amount, discountAmount, payAmount, balance, methods]
      properties:
        type:
          $ref: "#/components/schemas/OrderType"
        targetId:
          type: integer
          format: int64
        title:
          type: string
        amount:
          type: integer
          format: int64
          description: 原价（分）
        discountAmount:
          type: integer
          format: int64
          description: 会员折扣或升级抵扣（分）
        payAmount:
          type: integer
          format: int64
          description: 应付金额（分）
        membership:
          $ref: "#/components/schemas/MembershipQuote"
        balance:
          type: integer
          format: int64
          description: 当前余额（分）
        methods:
          type: array
          items:
            $ref: "#/components/schemas/PayMethodState"

    CreateOrderRequest:
      type: object
      required: [type, payMethod]
      properties:
        type:
          $ref: "#/components/schemas/OrderType"
        targetId:
          type: integer
          format: int64
          description: 内容 ID 或套餐 ID，充值不用传
        amount:
          type: integer
          format: int64
          description: 充值金额（分），只用于充值
        payMethod:
          $ref: "#/components/schemas/PayMethod"
        scene:
          $ref: "#/components/schemas/PayScene"

    PayOrderRequest:
      type: object
      required: [payMethod]
      properties:
        payMethod:
          $ref: "#/components/schemas/PayMethod"
        scene:
          $ref: "#/components/schemas/PayScene"

    OrderGrant:
      type: object
      required: [permanent, expiresAt]
      description: 支付后的发放结果
      properties:
        permanent:
          type: boolean
          description: 会员订单：开通的是永久会员
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: 会员订单：开通后的到期时间
        balanceAfter:
          type: integer
          format: int64
          description: 充值订单：到账后的余额
        failed:
          type: boolean
          description: 支付成功但权益没有发放成功，客服会人工处理

    Order:
      type: object
      required: [orderNo, type, targetId, title, amount, discountAmount, payAmount, payMethod, status, expiresAt, paidAt, createdAt]
      properties:
        orderNo:
          type: string
          example: "20261004153000123456"
        type:
          $ref: "#/components/schemas/OrderType"
        targetId:
          type: integer
          format: int64
        title:
          type: string
        amount:
          type: integer
          format: int64
        discountAmount:
          type: integer
          format: int64
        payAmount:
          type: integer
          format: int64
        payMethod:
          type: string
          enum: ["", wechat, alipay, balance]
          description: 空表示还没发起支付
        status:
          $ref: "#/components/schemas/OrderStatus"
        expiresAt:
          type: string
          format: date-time
          description: 待支付订单的自动关闭时间
        paidAt:
          type: string
          format: date-time
          nullable: true
        membership:
          $ref: "#/components/schemas/MembershipQuote"
        grant:
          $ref: "#/components/schemas/OrderGrant"
        createdAt:
          type: string
          format: date-time

    PayAction:
      type: object
      required: [kind, mock]
      properties:
        kind:
          type: string
          enum: [qrcode, redirect, paid]
          description: qrcode 展示 qrCode 内容的二维码 / redirect 跳转到 url / paid 已支付（余额支付）
        qrCode:
          type: string
        url:
          type: string
        mock:
          type: boolean
          description: 模拟支付，前台显示“模拟支付成功”按钮

    PayResult:
      type: object
      required: [order, action]
      properties:
        order:
          $ref: "#/components/schemas/Order"
        action:
          $ref: "#/components/schemas/PayAction"

    OrderPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer

    AccountOverview:
      type: object
      required: [balance, purchaseCount, spent, todayFreeDownloads, dailyLimit]
      properties:
        balance:
          type: integer
          format: int64
          description: 余额（分）
        purchaseCount:
          type: integer
          format: int64
        spent:
          type: integer
          format: int64
          description: 累计消费（分），不含充值
        todayFreeDownloads:
          type: integer
          description: 今天已用的会员免费下载次数
        dailyLimit:
          type: integer
          description: 当前会员等级每天的免费下载次数，0 表示不限或不是会员

    Purchase:
      type: object
      required: [postId, title, orderNo, amount, payAmount, createdAt]
      properties:
        postId:
          type: integer
          format: int64
        title:
          type: string
          description: 下单时的标题
        orderNo:
          type: string
        amount:
          type: integer
          format: int64
        payAmount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        post:
          $ref: "#/components/schemas/PostCard"

    PurchasePage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Purchase"
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer

    LedgerEntry:
      type: object
      required: [id, amount, balanceAfter, bizType, remark, createdAt]
      properties:
        id:
          type: integer
          format: int64
        amount:
          type: integer
          format: int64
          description: 正数入账，负数出账（分）
        balanceAfter:
          type: integer
          format: int64
        bizType:
          type: string
          enum: [recharge, purchase, refund, admin_adjust]
        remark:
          type: string
        createdAt:
          type: string
          format: date-time

    LedgerPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LedgerEntry"
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 业务错误码，前端据此判断错误类型
              example: INVALID_CREDENTIALS
            message:
              type: string
              description: 可直接展示给用户的提示
              example: 邮箱或密码不正确
