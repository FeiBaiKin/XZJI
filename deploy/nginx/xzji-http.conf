# 放进 Nginx 的 http 块：include /etc/nginx/snippets/xzji-http.conf;
# 宝塔和 1Panel 一般在“网站 - 配置文件”里能看到 http 块，把下面的内容粘进去。
# gzip 和 limit_req_zone 都只能写在 http 上下文，写在 server 块里会报错。

# 前台前面必须有开 gzip 的 Nginx：M5 实测不开 gzip 时 Lighthouse 首页只有 80 分，
# 开了之后首页 97、详情页 96。JS、CSS 都能压到原来的四分之一左右。
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    font/woff2;

# 防浏览器端刷接口用的限流区，在 api 域名的 server 块里用 limit_req 引用（见 single.conf）。
# 一个 IP 平均 20 次/秒，突发允许 60 次。
limit_req_zone $binary_remote_addr zone=xzji_api:10m rate=20r/s;
