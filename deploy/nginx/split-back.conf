# 分机部署：后端服务器，承接 api / admin / img 三个域名。
# 前台服务器的服务端渲染请求经内网直连后端 8080 端口，因此后端配置需要：
#   http.addr: 0.0.0.0:8080          （或只监听内网网卡地址）
#   http.trusted_proxies: [127.0.0.1, "<前台服务器的内网 IP>"]
# 并用防火墙限制 8080 端口只允许本机和前台服务器内网 IP 访问。
#
# api / admin / img 三个 server 块与 single.conf 中的写法相同，这里不再重复，复制时注意带上：
#   1) 各块里的 add_header（nosniff、Referrer-Policy，后台再加 X-Frame-Options: DENY 和 X-Robots-Tag）；
#   2) 图片域名块里的 autoindex off、禁脚本、禁止访问隐藏文件；
#   3) api 域名块里的 limit_req / limit_req_status / error_page 429 和 @xzji_too_many 命名 location；
#   4) Nginx 的 http 块里放进 deploy/nginx/xzji-http.conf（gzip 和 limit_req_zone）。

upstream xzji_api { server 127.0.0.1:8080; keepalive 32; }

server {
    listen 80;
    server_name api.example.com admin.example.com img.example.com;
    return 301 https://$host$request_uri;
}

# 从 single.conf 复制 api.example.com、admin.example.com、img.example.com 三个 server 块到这里
