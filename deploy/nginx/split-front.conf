# 分机部署：前台服务器，只承接 www 域名。
# Nuxt 服务端渲染时通过内网直连后端服务器，环境变量见 deploy/web.env.example：
#   NUXT_API_INTERNAL_BASE=http://<后端服务器内网 IP>:8080/api/v1
# 两台服务器建议放在同一地域或同一机房，减少服务端渲染时的接口延迟。
# 另外要把 deploy/nginx/xzji-http.conf 的内容放进 Nginx 的 http 块。

upstream xzji_web { server 127.0.0.1:3000; keepalive 32; }

server {
    listen 80;
    server_name www.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.example.com;
    ssl_certificate     /etc/nginx/ssl/example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/example.com.key;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS：确认 www 与 api 都是 https 之后再打开
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 后端内容变更后用它清空页面缓存，只允许后端服务器访问
    location /_internal/ {
        allow 10.0.0.2; # 后端服务器的内网 IP
        deny all;
        proxy_pass http://xzji_web;
        include /etc/nginx/snippets/xzji-proxy.conf;
    }

    # 带内容哈希的静态资源由 Nuxt 自己返回长期缓存，不要再加 add_header
    location / {
        proxy_pass http://xzji_web;
        include /etc/nginx/snippets/xzji-proxy.conf;
    }
}
