# 单机部署：一台服务器承接 www / api / admin / img 四个域名。
# 把 example.com 换成实际域名，证书路径按实际情况修改；宝塔用户可以把各个 server 块拆进对应站点的配置。
# http 块里建议开启：gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
# api 域名的限流也要写在 http 块里（limit_req_zone 只能出现在 http 上下文）：
#   limit_req_zone $binary_remote_addr zone=xzji_api:10m rate=20r/s;

upstream xzji_api { server 127.0.0.1:8080; keepalive 32; }
upstream xzji_web { server 127.0.0.1:3000; keepalive 32; }

server {
    listen 80;
    server_name www.example.com api.example.com admin.example.com img.example.com;
    return 301 https://$host$request_uri;
}

# 前台：Nuxt 服务端渲染
server {
    listen 443 ssl;
    http2 on;
    server_name www.example.com;
    ssl_certificate     /etc/nginx/ssl/example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/example.com.key;

    # 后端内容变更后用它清空页面缓存，只允许本机的后端程序访问
    location /_internal/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://xzji_web;
        include /etc/nginx/snippets/xzji-proxy.conf;
    }

    location / {
        proxy_pass http://xzji_web;
        include /etc/nginx/snippets/xzji-proxy.conf;
    }
}

# 前台接口：浏览器、App、小程序直连
server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;
    ssl_certificate     /etc/nginx/ssl/example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/example.com.key;
    client_max_body_size 20m;

    # 防浏览器端刷接口。前台服务端渲染走内网直连后端 8080，不经过这里，不会被限流，
    # 所以后端不需要识别“内部请求”的密钥机制。
    limit_req zone=xzji_api burst=60 nodelay;
    limit_req_status 429;
    error_page 429 @xzji_too_many;

    # 被限流时返回与后端一致的错误结构，客户端可以统一处理
    location @xzji_too_many {
        default_type application/json;
        return 429 '{"error":{"code":"TOO_MANY_REQUESTS","message":"请求过于频繁，请稍后再试"}}';
    }

    location / {
        proxy_pass http://xzji_api;
        include /etc/nginx/snippets/xzji-proxy.conf;
    }
}

# 后台：页面和接口都由后端程序提供，建议只放行自己的 IP
server {
    listen 443 ssl;
    http2 on;
    server_name admin.example.com;
    ssl_certificate     /etc/nginx/ssl/example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/example.com.key;
    client_max_body_size 20m;
    # allow 203.0.113.10;
    # deny all;

    location = / { return 302 /admin/; }
    location / {
        proxy_pass http://xzji_api;
        include /etc/nginx/snippets/xzji-proxy.conf;
    }
}

# 图片：上传目录由 Nginx 直接提供，禁止执行任何脚本
server {
    listen 443 ssl;
    http2 on;
    server_name img.example.com;
    ssl_certificate     /etc/nginx/ssl/example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/example.com.key;
    root /opt/xzji/server/data/uploads;

    location ~* \.(php|phtml|pl|py|jsp|asp|aspx|sh|cgi)$ { return 403; }
    location / {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
