# 生产环境后端配置样例，复制为 /opt/xzji/server/config.yaml 后修改
env: prod

http:
  addr: 127.0.0.1:8080 # 分机部署时改为 0.0.0.0:8080 并用防火墙限制来源
  trusted_proxies: [127.0.0.1, "::1"]

db:
  dsn: xzji:请替换为数据库密码@tcp(127.0.0.1:3306)/xzji
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 30m
  auto_migrate: true

log:
  level: info
  format: json

cors:
  allow_origins:
    - https://www.example.com

auth:
  cookie_domain: .example.com
  cookie_secure: true

mail:
  driver: smtp
  smtp:
    host: smtp.example.com
    port: 465
    implicit_tls: true
    username: noreply@example.com
    password: "" # 建议用环境变量 XZJI_SMTP_PASSWORD
    from: XZJI <noreply@example.com>

media:
  dir: data/uploads
  base_url: https://img.example.com # 图片域名，由 Nginx 直接提供 data/uploads
  max_size_mb: 10
  serve: false
