# 生产环境后端配置样例，复制为 /opt/xzji/server/config.yaml 后修改
env: prod
timezone: Asia/Shanghai

http:
  addr: 127.0.0.1:8080 # 分机部署时改为 0.0.0.0:8080 并用防火墙限制来源
  trusted_proxies: [127.0.0.1, "::1"]

db:
  dsn: xzji:请替换为数据库密码@tcp(127.0.0.1:3306)/xzji
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 30m
  auto_migrate: true

log:
  level: info
  format: json

cors:
  allow_origins:
    - https://www.example.com

auth:
  cookie_domain: .example.com
  cookie_secure: true

mail:
  driver: smtp
  smtp:
    host: smtp.example.com
    port: 465
    implicit_tls: true
    username: noreply@example.com
    password: "" # 建议用环境变量 XZJI_SMTP_PASSWORD
    from: XZJI <noreply@example.com>

media:
  dir: data/uploads
  base_url: https://img.example.com # 图片域名，由 Nginx 直接提供 data/uploads
  max_size_mb: 10
  serve: false

cache:
  size: 2000 # 公开接口响应的缓存条目上限
  max_bytes: 33554432 # 缓存占用的总字节上限（32MB），与 size 同时生效；单条响应最大 1MB，只限条数会占满内存
  ttl: 10m # 兜底过期时间；内容变更时后端会清空缓存，不依赖它

frontend:
  # 内容变更后要通知清除缓存的前台服务器地址；分机部署时改成前台的内网地址
  purge_urls: [http://127.0.0.1:3000]
  # 清除通知的 HMAC 密钥，必须与前台环境的 NUXT_PURGE_SECRET 一致，可用 openssl rand -hex 32 生成
  purge_secret: 请替换为随机密钥

# 加密后台填写的支付私钥等敏感配置，首次启动自动生成；请和数据库备份分开保管
secret_key_file: data/secret.key

pay:
  mock: false # 生产环境必须为 false；支付参数在后台“支付设置”里填写
