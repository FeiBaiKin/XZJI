version: "2"
sql:
  - engine: mysql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: dbgen
        out: internal/dbgen
        emit_interface: true
        emit_empty_slices: true
        emit_exact_table_names: false
        rename:
          medium: Media
        overrides:
          # Go 1.27 的 json.RawMessage 不能接收 NULL，可空的 JSON 列改用 []byte
          - db_type: json
            nullable: true
            go_type:
              type: "[]byte"
