# 复制为 config.yaml 后修改。db.dsn 也可以用环境变量 XZJI_DB_DSN 覆盖。
env: dev # dev 或 prod
timezone: Asia/Shanghai # 站点时区，用于按天统计下载次数

http:
  addr: 127.0.0.1:8080
  # 只信任这些地址传来的 X-Real-IP，通常是本机 Nginx
  trusted_proxies: [127.0.0.1, "::1"]

db:
  # 时区和字符集由程序强制设为 UTC 与 utf8mb4，DSN 里不用写
  dsn: xzji:请替换为数据库密码@tcp(127.0.0.1:3306)/xzji_dev
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 30m
  auto_migrate: true # 启动时自动执行数据库迁移

log:
  level: info  # debug / info / warn / error
  format: text # 开发用 text，生产用 json

cors:
  # 允许跨域访问前台接口的前台域名，必须精确匹配
  allow_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000

auth:
  # 生产填 .example.com，让 www 与 api 共享登录状态；开发留空
  cookie_domain: ""
  # 生产必须为 true（只在 HTTPS 下发送 Cookie）
  cookie_secure: false

mail:
  driver: log # log：验证码只写进日志（开发用）；smtp：真实发送
  smtp:
    host: smtp.example.com
    port: 465
    implicit_tls: true # 465 端口为 true；587 端口为 false（STARTTLS）
    username: ""
    password: "" # 也可以用环境变量 XZJI_SMTP_PASSWORD
    from: XZJI <noreply@example.com>

media:
  dir: data/uploads # 上传文件的保存目录
  base_url: http://localhost:8080/uploads # 上传文件的对外地址前缀，末尾不带 /
  max_size_mb: 10
  serve: true # 由后端直接提供上传文件（开发用），生产改为 false 交给 Nginx

# 加密数据库里敏感配置（后台填写的支付私钥等）的密钥文件，不存在时自动生成。
# 备份时单独保管；丢失后需要在后台重新填写支付参数
secret_key_file: data/secret.key

pay:
  # 模拟支付：微信、支付宝不连真实渠道，前台显示“模拟支付成功”按钮。只能用于开发环境
  # 支付参数（商户号、密钥）在后台“支付设置”里填写
  mock: true
