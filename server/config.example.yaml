# 复制为 config.yaml 后修改。db.dsn 也可以用环境变量 XZJI_DB_DSN 覆盖。
env: dev # dev 或 prod

http:
  addr: 127.0.0.1:8080
  # 只信任这些地址传来的 X-Real-IP，通常是本机 Nginx
  trusted_proxies: [127.0.0.1, "::1"]

db:
  # 时区和字符集由程序强制设为 UTC 与 utf8mb4，DSN 里不用写
  dsn: xzji:请替换为数据库密码@tcp(127.0.0.1:3306)/xzji_dev
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 30m
  auto_migrate: true # 启动时自动执行数据库迁移

log:
  level: info  # debug / info / warn / error
  format: text # 开发用 text，生产用 json

cors:
  # 允许跨域访问前台接口的前台域名，必须精确匹配
  allow_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000
